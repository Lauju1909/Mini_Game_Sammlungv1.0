[package]
name = "mini_game_sammlung"
version = "1.3.0"
edition = "2021"
authors = ["Lauju1909"]
description = "Mini Game Sammlung - Native Rust Audio, Highscore & Launcher Engine"

[lib]
name = "mini_game_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "Mini_Game_Sammlung_Rust"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
